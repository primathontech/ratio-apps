services:
  # Local-only remap: host port 9092 is already bound by an unrelated
  # container on this machine (os-kafka) — this worktree's own kafka
  # container needs a second, EXTERNAL listener on a free host port for
  # anything running directly on the host (`pnpm --filter @ratio-app/backend
  # dev`) to reach it, while the in-container healthcheck and any
  # docker-network traffic keep using the original internal PLAINTEXT
  # listener on :9092 unchanged (advertised as `localhost:9092`, which
  # resolves correctly FROM INSIDE the container's own network namespace —
  # a single shared advertised address can't satisfy both audiences at once).
  kafka:
    ports:
      - "9095:9095"
    environment:
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,EXTERNAL://localhost:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
